name = "blog-test2-admin-api"
main = "src/index.js"
compatibility_date = "2026-08-12"

# 线上地址：https://blog-test2-admin-api.2799587522.workers.dev
# routes 不绑定主站，避免把管理 API 混入静态站点。

[[kv_namespaces]]
binding = "SESSIONS"
# blog_test2 独立会话与公共状态缓存，不与其他站点共用。
id = "b1d90f3e70ab4c7f8ab78586b03afdf4"

[vars]
ALLOWED_ORIGIN = "https://ice11123.github.io"
GITHUB_OWNER = "ice11123"
GITHUB_REPO = "blog_test2"
GITHUB_BRANCH = "main"

# Secret（使用 wrangler secret put 设置，绝不提交到仓库）：
# GITHUB_OAUTH_CLIENT_ID
# GITHUB_OAUTH_CLIENT_SECRET
# SESSION_SECRET
